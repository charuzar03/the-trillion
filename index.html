<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Trillion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #e8f4ff;
    --muted: #8fb3d6;
    --card: rgba(6, 14, 34, 0.88);
    --card-edge: #6fb6ff;
    --pink: #ff4f9a;
    --pink-dark: #b8226a;
    --amber: #ffb547;
    --red: #ff3b3b;
    --purple: #b56bff;
    --gold: #ffd34d;
    --gold-deep: #e09a1a;
    --cyan: #5ff4ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #02040e; color: var(--ink);
    font-family: "VT323", ui-monospace, monospace;
    -webkit-font-smoothing: none;
    touch-action: manipulation;
  }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #app.shake { animation: shake 0.55s steps(2) 1; }
  @keyframes shake {
    0% { transform: translate(0,0); } 15% { transform: translate(-9px, 5px); }
    30% { transform: translate(8px,-6px); } 45% { transform: translate(-6px,-4px); }
    60% { transform: translate(5px, 6px); } 75% { transform: translate(-3px, 2px); }
    100% { transform: translate(0,0); }
  }
  canvas#world {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #markerClip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #markers { position: absolute; left: 0; top: 0; width: 100%; height: 0; pointer-events: none; will-change: transform; }
  .marker {
    position: absolute; left: 0; width: 100%;
    font-size: 19px; color: rgba(190, 225, 255, 0.55); letter-spacing: 1px;
    padding-left: 14px; white-space: nowrap;
    border-top: 1px dashed rgba(190, 225, 255, 0.16);
  }
  .marker span { position: relative; top: -12px; background: transparent; }
  .marker.deepest { color: rgba(255, 211, 77, 0.75); border-top-color: rgba(255, 211, 77, 0.3); }

  /* CRT overlay */
  #crt {
    position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0.0) 0px, rgba(0,0,0,0.0) 2px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.0) 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode: multiply;
  }
  #crt::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(120, 200, 255, 0.025);
    animation: flicker 0.18s steps(2) infinite;
  }
  @keyframes flicker { 0% { opacity: 0.6; } 100% { opacity: 1; } }

  .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }
  .fade { transition: opacity 0.45s ease, visibility 0.45s; }

  /* pixel-bordered box */
  .px-box {
    background: var(--card);
    border: 3px solid var(--card-edge);
    box-shadow: 0 0 0 3px #02040e, 6px 6px 0 3px rgba(0,0,0,0.5);
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- title ---------- */
  #title {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: max(9vh, 40px) 16px 0; text-align: center;
  }
  .glitch {
    position: relative; margin: 0;
    font-family: "Press Start 2P", monospace; font-weight: normal;
    font-size: clamp(26px, 7.2vw, 78px); line-height: 1.15; letter-spacing: 2px;
    color: #fff;
    text-shadow: 4px 4px 0 #1a3d7a, 8px 8px 0 rgba(0,0,0,0.25);
  }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; left: 0; top: 0; width: 100%;
    text-shadow: none; pointer-events: none;
  }
  .glitch::before { color: #ff2e88; mix-blend-mode: screen; animation: glitchA 2.6s steps(1) infinite; opacity: 0.8; }
  .glitch::after  { color: #2ef6ff; mix-blend-mode: screen; animation: glitchB 3.1s steps(1) infinite; opacity: 0.8; }
  @keyframes glitchA {
    0%   { transform: translate(-3px, 0); clip-path: inset(0 0 70% 0); }
    8%   { transform: translate(3px, 1px); clip-path: inset(40% 0 30% 0); }
    16%  { transform: translate(-2px, 0); clip-path: inset(80% 0 0 0); }
    24%, 100% { transform: translate(-2px, 0); clip-path: inset(0 0 100% 0); }
  }
  @keyframes glitchB {
    0%, 60% { transform: translate(2px, 0); clip-path: inset(0 0 100% 0); }
    64%  { transform: translate(4px, -1px); clip-path: inset(10% 0 55% 0); }
    70%  { transform: translate(-3px, 1px); clip-path: inset(60% 0 15% 0); }
    76%  { transform: translate(2px, 0); clip-path: inset(30% 0 50% 0); }
    80%, 100% { clip-path: inset(0 0 100% 0); }
  }
  #subtitle {
    margin: 18px 0 0; font-size: clamp(24px, 3.2vw, 34px); color: #0d2a5c; letter-spacing: 3px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
  }
  #tagline {
    margin: 10px 0 0; font-size: clamp(18px, 2.2vw, 23px); color: #1d4a86; letter-spacing: 1px;
  }
  #beginBtn {
    margin-top: auto; margin-bottom: max(10vh, 56px);
    font-family: "Press Start 2P", monospace; font-size: clamp(13px, 1.9vw, 19px);
    color: #fff; background: var(--pink); padding: 20px 30px;
    border: 4px solid #fff; box-shadow: 0 0 0 4px #02040e, 6px 6px 0 4px rgba(0,0,0,0.45);
    letter-spacing: 1px; animation: bob 1.6s ease-in-out infinite;
  }
  #beginBtn:hover { background: #ff69ab; }
  #beginBtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 4px #02040e, 2px 2px 0 4px rgba(0,0,0,0.45); }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -5px; } }

  /* ---------- HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
  #depthBox {
    position: absolute; left: 14px; top: 14px; padding: 6px 14px 4px; min-width: 120px;
  }
  #depthBox .lbl { font-size: 16px; color: var(--muted); letter-spacing: 2px; }
  #depthVal { font-size: 34px; line-height: 1; color: var(--cyan); text-shadow: 0 0 8px rgba(95,244,255,0.5); }
  #progress {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    padding: 6px 14px; text-align: center; white-space: nowrap;
  }
  #progressTxt { font-size: 20px; letter-spacing: 2px; }
  #pips { display: flex; gap: 6px; justify-content: center; margin-top: 4px; }
  .pip { width: 14px; height: 8px; background: #1b2c4f; border: 1px solid #39578a; }
  .pip.done { background: var(--cyan); border-color: var(--cyan); }
  .pip.now { background: var(--pink); border-color: #fff; animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #muteBtn {
    position: absolute; right: 14px; top: 14px; z-index: 60; pointer-events: auto;
    font-family: "VT323", monospace; font-size: 20px; color: var(--ink);
    background: rgba(6,14,34,0.8); border: 3px solid var(--card-edge); padding: 4px 10px;
    box-shadow: 0 0 0 3px #02040e;
  }

  /* ---------- prompt card ---------- */
  #promptCard {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    width: min(620px, calc(100vw - 32px)); padding: 22px 26px 24px; z-index: 15; text-align: center;
  }
  #promptCard .kicker { font-size: 18px; color: var(--muted); letter-spacing: 3px; }
  #promptText { font-size: clamp(28px, 3.4vw, 38px); line-height: 1.12; margin: 8px 0 0; }
  #finalBtns { display: flex; gap: 24px; justify-content: center; margin-top: 22px; }
  .bigBtn {
    font-family: "Press Start 2P", monospace; font-size: 16px; padding: 16px 28px;
    color: #fff; border: 4px solid #fff; box-shadow: 0 0 0 4px #02040e, 5px 5px 0 4px rgba(0,0,0,0.45);
  }
  .yesBtn { background: #24b36b; }
  .yesBtn:hover { background: #2fd27f; }
  .noBtn { background: #6b7690; }
  #noBtn.loose { animation: hop 0.25s steps(3) 1; }
  @keyframes hop { 0% { transform: scale(0.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #noBtn.loose { position: fixed; z-index: 40; margin: 0; }

  /* ---------- input bar ---------- */
  #bottomBar {
    position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 15;
    width: min(620px, calc(100vw - 32px));
  }
  #inputRow { display: flex; align-items: center; gap: 12px; }
  #ring { position: relative; width: 66px; height: 66px; flex: 0 0 66px; }
  #ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  #ring .bg { stroke: #1b2c4f; }
  #ring .fg { stroke: var(--cyan); transition: stroke 0.2s; }
  #ringNum {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 30px; padding-top: 2px;
  }
  #ring.danger .fg { stroke: var(--red); }
  #ring.danger { animation: pulse 0.9s ease-in-out infinite; }
  #ring.danger #ringNum { color: var(--red); }
  @keyframes pulse {
    0%,100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255,59,59,0)); }
    50% { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(255,59,59,0.9)); }
  }
  #answerInput {
    flex: 1; min-width: 0; height: 56px; padding: 0 14px;
    font-family: "VT323", monospace; font-size: 28px; color: var(--ink);
    background: rgba(4, 10, 26, 0.92); border: 3px solid var(--card-edge); outline: none;
    box-shadow: 0 0 0 3px #02040e;
  }
  #answerInput:focus { border-color: #fff; }
  #answerInput::placeholder { color: #4d6c95; }
  #answerInput.nudge { animation: nudge 0.3s steps(2) 1; }
  @keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #diveBtn {
    height: 56px; padding: 0 20px;
    font-family: "Press Start 2P", monospace; font-size: 15px; color: #fff;
    background: var(--pink); border: 3px solid #fff; box-shadow: 0 0 0 3px #02040e, 4px 4px 0 3px rgba(0,0,0,0.45);
  }
  #diveBtn:hover { background: #ff69ab; }
  #diveBtn:active { transform: translate(2px, 2px); }
  #wrongLine {
    min-height: 26px; margin: 8px 0 0 78px; font-size: 22px; color: var(--amber);
    text-shadow: 0 0 6px rgba(255, 181, 71, 0.4); word-break: break-word;
  }
  #hateBubble {
    position: absolute; left: 50%; bottom: calc(100% + 18px); transform: translateX(-50%);
    background: #fff; color: #111; font-size: 26px; padding: 8px 16px; white-space: nowrap;
    border: 3px solid #111; box-shadow: 0 0 0 3px #fff;
    transition: opacity 0.8s ease;
  }
  #hateBubble::after {
    content: ""; position: absolute; left: 50%; top: 100%; margin-left: -8px;
    border: 8px solid transparent; border-top-color: #111;
  }
  #hateBubble.pop { animation: popIn 0.25s steps(3) 1; }
  @keyframes popIn { 0% { transform: translateX(-50%) scale(0.4); } 100% { transform: translateX(-50%) scale(1); } }

  /* ---------- answer tag + result ---------- */
  #answerTag {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    z-index: 14; padding: 8px 16px; font-size: 30px; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    background: rgba(4,10,26,0.85); border: 3px solid #fff; box-shadow: 0 0 0 3px #02040e;
  }
  #answerTag.nuke { border-color: var(--red); }
  #answerTag.icbm { border-color: var(--purple); box-shadow: 0 0 0 3px #02040e, 0 0 18px rgba(181,107,255,0.6); }
  #resultCard {
    position: absolute; left: 50%; top: calc(50% + 34px); transform: translate(-50%, -50%);
    width: min(520px, calc(100vw - 32px)); padding: 22px 24px 24px; z-index: 16; text-align: center;
    background: rgba(3, 6, 16, 0.94);
  }
  #resultCard.land { animation: land 0.35s steps(4) 1; }
  @keyframes land { 0% { transform: translate(-50%, -38%); opacity: 0; } 100% { transform: translate(-50%, -50%); opacity: 1; } }
  #resultIcon { width: 80px; height: 80px; image-rendering: pixelated; display: block; margin: 0 auto 10px; }
  #tierLabel {
    font-family: "Press Start 2P", monospace; font-size: clamp(14px, 2.2vw, 20px); line-height: 1.5;
    margin: 0 auto; max-width: 440px;
  }
  #tierLabel.nuke { color: var(--red); text-shadow: 3px 3px 0 #4a0000, 0 0 14px rgba(255,59,59,0.6); }
  #tierLabel.clever { color: #ffe14d; text-shadow: 3px 3px 0 #5a3d00, 0 0 14px rgba(255,211,77,0.7); }
  #resultCard.clever { border-color: #ffd34d; }
  #answerTag.clever { border-color: #ffd34d; box-shadow: 0 0 0 3px #02040e, 0 0 18px rgba(255,211,77,0.6); }
  #autoNote { font-size: 18px; color: var(--muted); opacity: 0.8; margin: 0 0 6px; }
  #autoNote:empty { display: none; }
  #flash.go-gold { animation: flashGold 0.9s ease-out 1; }
  @keyframes flashGold { 0% { background: #fff6c4; opacity: 0.95; } 25% { background: #ffd34d; opacity: 0.8; } 100% { background: #ffd34d; opacity: 0; } }
  #tierLabel.icbm { color: var(--purple); text-shadow: 3px 3px 0 #2a0a4d, 0 0 14px rgba(181,107,255,0.6); }
  #resultAnswer { font-size: 32px; margin: 14px 0 4px; }
  #descendBtn { margin-top: 14px; }
  #descendBtn {
    font-family: "Press Start 2P", monospace; font-size: 14px; color: #fff; padding: 14px 22px;
    background: #1a5bd6; border: 3px solid #fff; box-shadow: 0 0 0 3px #02040e, 4px 4px 0 3px rgba(0,0,0,0.45);
  }
  #descendBtn:hover { background: #2a6cf0; }
  #resultCard.nuke { border-color: var(--red); }
  #resultCard.icbm { border-color: var(--purple); }

  #resultCard.has-others { width: min(820px, calc(100vw - 32px)); display: flex; gap: 22px; align-items: stretch; }
  .resMain { flex: 1; min-width: 0; }
  .resOthers { display: none; flex: 0 0 230px; text-align: left; padding-left: 20px; border-left: 2px dashed #39578a; }
  #resultCard.has-others .resOthers { display: flex; flex-direction: column; justify-content: center; }
  .othersHead { font-size: 18px; letter-spacing: 3px; color: var(--muted); margin-bottom: 12px; }
  .other { margin: 0 0 14px; padding: 8px 10px; border: 2px solid #26385e; background: rgba(10, 20, 44, 0.7);
    opacity: 0; transform: translateX(12px); transition: opacity 0.35s, transform 0.35s steps(3); }
  .other.in { opacity: 1; transform: none; }
  .other .otag { font-family: "Press Start 2P", monospace; font-size: 9px; letter-spacing: 1px; margin-bottom: 4px; }
  .other.nuke .otag { color: var(--red); }
  .other.icbm .otag { color: var(--purple); }
  .other.clever .otag { color: #ffe14d; }
  .other.mine.clever { border-color: #ffd34d; box-shadow: 0 0 10px rgba(255,211,77,0.5); }
  .other .oans { color: #a9c3e2; font-size: 22px; line-height: 1.1; margin-top: 3px; }
  .other .oans.hit { color: #fff; }
  .other .oans { padding-left: 14px; text-indent: -14px; }
  .other .oans::before { content: "▸ "; color: #4d6c95; }
  .other .oans.hit::before { color: var(--cyan); }
  .other .oans { word-break: break-word; min-height: 22px; }
  .other .you { font-size: 18px; color: var(--cyan); white-space: nowrap; }
  .other.mine.nuke { border-color: var(--red); }
  .other.mine.icbm { border-color: var(--purple); box-shadow: 0 0 10px rgba(181,107,255,0.5); }

  /* ICBM drama */
  #resultCard.icbm.boom { animation: icbmLand 0.6s steps(6) 1, icbmGlow 1.6s ease-in-out 0.6s infinite; }
  @keyframes icbmLand {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes icbmGlow {
    0%,100% { box-shadow: 0 0 0 3px #02040e, 0 0 18px 2px rgba(181,107,255,0.45); }
    50% { box-shadow: 0 0 0 3px #02040e, 0 0 42px 10px rgba(181,107,255,0.8); }
  }
  #tierLabel.icbm.boom { animation: labelGlitch 1.4s steps(1) 1, labelPulse 1.2s ease-in-out 1.4s infinite; }
  @keyframes labelGlitch {
    0%   { text-shadow: -4px 0 #ff2e88, 4px 0 #2ef6ff; transform: translateX(-3px); }
    12%  { text-shadow: 5px 0 #ff2e88, -5px 0 #2ef6ff; transform: translateX(4px); }
    24%  { text-shadow: -3px 2px #ff2e88, 3px -2px #2ef6ff; transform: translateX(-2px); }
    36%  { text-shadow: 6px 0 #ff2e88, -2px 0 #2ef6ff; transform: none; }
    50%  { text-shadow: -2px 0 #ff2e88, 2px 0 #2ef6ff; }
    70%, 100% { text-shadow: 3px 3px 0 #2a0a4d, 0 0 14px rgba(181,107,255,0.6); transform: none; }
  }
  @keyframes labelPulse { 50% { text-shadow: 3px 3px 0 #2a0a4d, 0 0 26px rgba(220,160,255,1); filter: brightness(1.25); } }
  #app.shakeBig { animation: shakeBig 1.2s steps(2) 1; }
  @keyframes shakeBig {
    0% { transform: translate(0,0); } 8% { transform: translate(-16px, 10px) rotate(-0.6deg); }
    16% { transform: translate(15px,-12px) rotate(0.6deg); } 24% { transform: translate(-13px,-8px); }
    32% { transform: translate(12px, 11px) rotate(-0.4deg); } 42% { transform: translate(-9px, 6px); }
    52% { transform: translate(8px,-7px); } 64% { transform: translate(-5px, 4px); }
    78% { transform: translate(3px,-2px); } 100% { transform: translate(0,0); }
  }

  #flash { position: fixed; inset: 0; background: #ff2a2a; z-index: 45; pointer-events: none; opacity: 0; }
  #flash.go { animation: flash 0.7s ease-out 1; }
  #flash.go-icbm { animation: flashIcbm 1.6s ease-out 1; }
  @keyframes flashIcbm {
    0%   { background: #ffffff; opacity: 1; }
    8%   { background: #b56bff; opacity: 0.95; }
    20%  { background: #ff2a2a; opacity: 0.85; }
    32%  { background: #b56bff; opacity: 0.75; }
    44%  { background: #ff2a2a; opacity: 0.5; }
    60%  { background: #b56bff; opacity: 0.35; }
    100% { background: #b56bff; opacity: 0; }
  }
  @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }

  #dark { position: fixed; inset: 0; background: #000; z-index: 46; pointer-events: none; opacity: 0; transition: opacity 1.3s ease; }
  #dark.on { opacity: 1; }

  /* ---------- ending ---------- */
  #ending {
    position: fixed; inset: 0; z-index: 48; overflow-y: auto;
    background: radial-gradient(ellipse at 50% 35%, rgba(120, 80, 0, 0.35), rgba(0,0,0,0) 60%), #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 16px; text-align: center;
  }
  #ending .stage { opacity: 0; transform: translateY(10px); transition: opacity 1.2s ease, transform 1.2s ease; }
  #ending .stage.in { opacity: 1; transform: none; }
  #goldRow { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
  #goldKrillWrap { position: relative; width: 210px; height: 114px; }
  #goldKrill {
    position: absolute; left: 0; top: 12px; width: 210px; height: 90px; image-rendering: pixelated;
    filter: drop-shadow(0 0 6px rgba(255, 211, 77, 0.9)) drop-shadow(0 0 22px rgba(255, 170, 30, 0.7));
    animation: krillFloat 3.4s ease-in-out infinite;
  }
  @keyframes krillFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .spark {
    position: absolute; width: 12px; height: 12px; pointer-events: none;
    background:
      linear-gradient(#fff6c4, #fff6c4) center/4px 12px no-repeat,
      linear-gradient(#fff6c4, #fff6c4) center/12px 4px no-repeat;
    filter: drop-shadow(0 0 4px #ffd34d);
    animation: twinkle 1.6s steps(4) infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1); } }
  #goldHead {
    margin: 0; font-family: "Press Start 2P", monospace; font-weight: normal;
    font-size: clamp(22px, 4.4vw, 48px); line-height: 1.35; color: var(--gold);
    text-shadow: 4px 4px 0 #6b3d00, 0 0 18px rgba(255, 200, 60, 0.75), 0 0 42px rgba(255, 160, 20, 0.45);
    animation: glow 2.4s ease-in-out infinite;
  }
  @keyframes glow { 50% { filter: brightness(1.18); } }
  #endYes { font-family: "Press Start 2P", monospace; font-size: clamp(16px, 2.4vw, 24px); color: var(--gold); margin: 26px 0 0; text-shadow: 0 0 12px rgba(255,200,60,0.6); }
  #endDetails { font-size: clamp(26px, 3.2vw, 36px); color: #ffe48a; margin: 14px 0 0; text-shadow: 0 0 10px rgba(255,200,60,0.35); }
  #endNote { font-size: 22px; color: #a8915a; margin: 8px 0 0; }
  #endNote:empty { display: none; }
  #endLine { font-size: clamp(24px, 3vw, 32px); color: #fff1a8; margin: 12px 0 0; text-shadow: 0 0 10px rgba(255,200,60,0.4); }
  #thumbWrap { margin-top: 22px; }
  #thumb { width: 200px; height: 200px; image-rendering: pixelated; animation: underwater 4.2s ease-in-out infinite; }
  @keyframes underwater {
    0%,100% { transform: translate(0, 0) rotate(-2deg); }

    const k = krill[i];
    const age = (now - k.born) / 1000;
    if (k.die && now > k.die) { krill.splice(i, 1); continue; }
    const c = k.center();
    k.ang += k.w * dt;

    ctx.globalAlpha = 1;
  }

    const y = lerp(missile.y0, missile.y1, t * t);
    const x = missile.x + Math.sin(t * 20) * (1 - t) * 1.5;
    for (let k = 0; k < 3; k++) sparks.push({ x: x + (Math.random() - 0.5) * 4, y: y + 14, vx: (Math.random() - 0.5) * 20, vy: 30 + Math.random() * 40,
      born: now, life: 300 + Math.random() * 300, col: Math.random() < 0.5 ? "#ff8a2a" : "#ffe066" });
    drawMap(ctx, MISSILE, MISSILE_PAL, (x - 8) | 0, (y - 8) | 0);

    ctx.globalAlpha = 1 - age / 1.1;
    ctx.fillStyle = r.col;
    const n = Math.min(400, Math.max(24, rad * 2.2 | 0));
    for (let k = 0; k < n; k++) {
      const a = k / n * Math.PI * 2;
      ctx.fillRect((r.x + Math.cos(a) * rad) | 0, (r.y + Math.sin(a) * rad * 0.8) | 0, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  // sparks / exhaust
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i], age = now - p.born;
    if (age > p.life) { sparks.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97;
    ctx.globalAlpha = 1 - age / p.life;
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x | 0, p.y | 0, 2, 2);
    ctx.globalAlpha = 1;
  }
}

  resetNo();
  $("finalBtns").style.display = "flex";
  show(promptCard);
}
function resetNo() {
  dodges = 0; lastDodge = 0;
  noBtn.textContent = "noooooo...";
  noBtn.className = "bigBtn noBtn";
  noBtn.style.left = noBtn.style.top = "";
  noBtn.style.display = "";
  $("finalBtns").appendChild(noBtn);
}
function noIsYes() { return dodges >= 4; }
let lastDodge = 0;
function dodge(px, py) {
  if (state !== "final" || noIsYes()) return;
  if (performance.now() - lastDodge < 650) return; // let it land so she has to chase it again
  lastDodge = performance.now();
  const r = noBtn.getBoundingClientRect();
  if (!noBtn.classList.contains("loose")) {
    // the card has a CSS transform, which would trap position:fixed, so lift the button to <body>
    noBtn.classList.add("loose");
    noBtn.style.left = r.left + "px"; noBtn.style.top = r.top + "px";
    document.body.appendChild(noBtn);
    void noBtn.offsetWidth;
  }
  const yr = yesBtn.getBoundingClientRect();
  const pad = 24, bw = r.width, bh = r.height;
  let best = null;
  for (let tries = 0; tries < 80; tries++) {
    const x = 16 + Math.random() * Math.max(1, innerWidth - bw - 32);
    const y = 16 + Math.random() * Math.max(1, innerHeight - bh - 32);
    const overlapsYes = !(x + bw + pad < yr.left || x - pad > yr.right || y + bh + pad < yr.top || y - pad > yr.bottom);
    if (overlapsYes) continue;
    const dist = Math.hypot(x + bw / 2 - px, y + bh / 2 - py);
    if (dist < Math.min(280, Math.max(innerWidth, innerHeight) * 0.35) && tries < 75) continue;
    best = { x, y }; break;
  }
  if (!best) return;
  noBtn.style.left = best.x + "px"; noBtn.style.top = best.y + "px";
  noBtn.style.animation = "none"; void noBtn.offsetWidth; noBtn.style.animation = ""; // replay the little hop
  dodges++;
  SFX.boing();
  if (noIsYes()) {
    noBtn.textContent = "Yes";
    noBtn.className = "bigBtn yesBtn loose";
  }
}
document.addEventListener("mousemove", e => {
  if (state !== "final" || noIsYes()) return;
  const r = noBtn.getBoundingClientRect();
  const cx = clamp(e.clientX, r.left, r.right), cy = clamp(e.clientY, r.top, r.bottom);
  if (Math.hypot(e.clientX - cx, e.clientY - cy) < 8) dodge(e.clientX, e.clientY); // she has to actually reach it
});
let lastPointerDodge = 0;
noBtn.addEventListener("pointerdown", e => {
  if (noIsYes()) return;
  e.preventDefault(); lastPointerDodge = performance.now(); dodge(e.clientX, e.clientY);
});
noBtn.addEventListener("click", e => {
  e.preventDefault();
  if (performance.now() - lastPointerDodge < 600) return; // same tap already dodged (or just turned into Yes)
  if (noIsYes()) { sayYes(); return; }
  const r = noBtn.getBoundingClientRect(); dodge(r.left + r.width / 2, r.top + r.height / 2);
});
noBtn.addEventListener("focus", () => { if (!noIsYes() && state === "final") noBtn.blur(); });
yesBtn.addEventListener("click", sayYes);

// ---------- yes ending ----------
function sayYes() {
  if (state !== "final") return;
  state = "ending";
  ensureAudio();
  hide(promptCard); hide(hud);
  noBtn.style.display = "none";
  SFX.gather();
  const center = () => ({ x: W / 2, y: H * 0.45 });
  spawnSwarm(46, "#ff3b3b", "#ffb3b3", "#7a0f12", center, 10, 70, 2.6, 0.55);
  spawnSwarm(24, "#e0262f", "#ff8a8a", "#5a0a0d", center, 30, 100, 1.8, 0.5);
  setTimeout(() => $("dark").classList.add("on"), 2800);
  setTimeout(() => {
    muteBtn.style.display = "none";
    fadeKrill(10);
    show($("ending"));
    drawGoldKrill(); makeSparkles(); pixelThumb();
    const stages = ["goldRow", "endYes", "endLine", "endDetails", "endNote", "thumbWrap"].filter(id => $(id).textContent.trim() || id === "thumbWrap" || id === "goldRow");
    stages.forEach((id, i) => setTimeout(() => $(id).classList.add("in"), 300 + i * 900));
    setTimeout(() => SFX.chime(), 300);
  }, 4300);
}
function drawGoldKrill() {
  const c = $("goldKrill").getContext("2d");
  c.clearRect(0, 0, 28, 12);
  drawMap(c, GOLD_KRILL, { a: "#fff1a8", b: "#e09a1a", B: "#ffd34d", h: "#f0b020", t: "#ffe680", l: "#c27a0e", e: "#3a2000" }, 0, 0);
}
function makeSparkles() {
  const wrap = $("goldKrillWrap");
  wrap.querySelectorAll(".spark").forEach(s => s.remove());
  const spots = [[-14, 4], [186, 10], [30, 90], [150, 92], [92, -6], [-4, 66], [200, 56]];
  spots.forEach(([x, y], i) => {
    const s = document.createElement("div"); s.className = "spark";
    s.style.left = x + "px"; s.style.top = y + "px"; s.style.animationDelay = (i * 0.27) + "s";
    wrap.appendChild(s);
  });
}
function pixelThumb() {
  const img = new Image();
  img.onload = () => {
    const c = $("thumb"), g = c.getContext("2d");
    g.clearRect(0, 0, 40, 40);
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = "high";
    g.drawImage(img, 0, 0, 40, 40);
    try { // crisp alpha + posterize so it reads as chunky pixel art
      const d = g.getImageData(0, 0, 40, 40), p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        if (p[i + 3] < 110) { p[i + 3] = 0; continue; }
        p[i + 3] = 255;
        for (let k = 0; k < 3; k++) p[i + k] = Math.min(255, Math.round(p[i + k] / 36) * 36);
      }
      g.putImageData(d, 0, 0);
    } catch (e) { /* tainted canvas (file://): keep the smooth-downscaled version */ }
  };
  img.src = "assets/thumbs-up.png";
}

// ---------- input ----------
$("diveBtn").addEventListener("click", submit);
input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });

// Secret author key: Shift+R restarts the current question
document.addEventListener("keydown", e => {
  if (!(e.shiftKey && (e.key === "R" || e.code === "KeyR") && !e.ctrlKey && !e.metaKey && !e.altKey)) return;
  if (state === "question") {
    e.preventDefault();
    input.value = ""; wrongLine.textContent = ""; clearHate();
    startTimer(); input.focus({ preventScroll: true });
  } else if (state === "final") {
    e.preventDefault(); resetNo();
  }
});

// ---------- main loop ----------
let last = performance.now();
const appEl = $("app");
let rafPending = false, lastStep = performance.now();
function schedule() { if (!rafPending) { rafPending = true; requestAnimationFrame(loop); } }
function loop(ts) { rafPending = false; step(ts); schedule(); }
// watchdog: if the browser stops delivering animation frames (hidden/throttled), keep the game moving
setInterval(() => { const t = performance.now(); if (t - lastStep > 250) step(t); }, 100);
function step(ts) {
  lastStep = performance.now();
  now = ts;
  const dt = clamp((ts - last) / 1000, 0, 0.05); last = ts;
  if (tween) {
    const t = clamp((ts - tween.start) / tween.dur, 0, 1);
    camDepth = lerp(tween.from, tween.to, easeInOut(t));
    if (t >= 1) { const d = tween.done; tween = null; d && d(); }
  }
  frame(dt);
  markersEl.style.transform = `translateY(${-camTop() * SCALE}px)`;
  $("depthVal").textContent = Math.max(0, Math.round(camDepth)).toLocaleString() + "m";
  updateTimer();
  if (appEl.scrollTop || appEl.scrollLeft) { appEl.scrollTop = 0; appEl.scrollLeft = 0; }
}

resize();
camDepth = titleDepth();
buildMarkers(); layoutMarkers();
schedule();
})();
</script>
</body>
